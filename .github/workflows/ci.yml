name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: zpevnak
          POSTGRES_PASSWORD: zpevnak
          POSTGRES_DB: zpevnak
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U zpevnak"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Types
        run: yarn lint:tsc
      - name: ESLint
        run: yarn lint:eslint
      - name: Unused code
        run: yarn lint:knip
      - name: Formatting
        run: yarn lint:prettier
      - name: Tests
        run: yarn test
      - name: Client build
        run: yarn build
